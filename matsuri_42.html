resize();addEventListener('resize',resize);

// ===== 音 =====
let AC=null,noiseBuf=null;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function tone(freq,dur,type='square',vol=0.15,when=0,slideTo=0){
  const a=ac();if(!a)return;
  const t=when||a.currentTime;
  const o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.02);
}
function noise(dur,vol,when,hp=6000){
  const a=ac();if(!a)return;
  if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate*0.5,a.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=noiseBuf;f.type='highpass';f.frequency.value=hp;
  g.gain.setValueAtTime(vol,when);g.gain.exponentialRampToValueAtTime(0.001,when+dur);
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(when);s.stop(when+dur+0.02);
}
const mtof=m=>440*Math.pow(2,(m-69)/12);
const SFX={
  click(){tone(880,0.08,'square',0.08)},
  pick(){tone(784,0.08,'square',0.1);tone(1175,0.15,'square',0.1,ac()&&AC.currentTime+0.08)},
  bonk(){tone(300,0.25,'sawtooth',0.12,0,120)},
  scare(){tone(200,0.4,'sawtooth',0.1,0,900);noise(0.3,0.15,ac()?AC.currentTime:0,2000)},
  miss(){tone(220,0.15,'triangle',0.1,0,150)},
  pop(){tone(600,0.1,'square',0.1,0,1200)},
  shoot(){noise(0.08,0.2,ac()?AC.currentTime:0,1500)},
  fanfare(){const a=ac();if(!a)return;const t=a.currentTime;[72,76,79,84,79,84].forEach((m,i)=>tone(mtof(m),i===5?0.6:0.18,'square',0.1,t+i*0.14))},
  start(){const a=ac();if(!a)return;const t=a.currentTime;[67,72].forEach((m,i)=>tone(mtof(m),0.2,'square',0.1,t+i*0.12))}
};

// ===== 入力 =====
const keys={};
const mouse={x:W/2,y:H/2,down:false};
let buttons=[];
function toCanvas(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
cv.addEventListener('pointerdown',e=>{
  ac();const p=toCanvas(e);mouse.x=p.x;mouse.y=p.y;mouse.down=true;keys.lastKeyboard=false;
  for(let i=buttons.length-1;i>=0;i--){const b=buttons[i];
    if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){SFX.click();b.fn();return}}
  if(SCENES[scene].tap)SCENES[scene].tap(p);
});
cv.addEventListener('pointermove',e=>{const p=toCanvas(e);mouse.x=p.x;mouse.y=p.y});
addEventListener('pointerup',()=>{mouse.down=false});
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
  ac();
  if(e.repeat){keys[e.key]=true;return}
  keys.lastKeyboard=true;
  keys[e.key]=true;
  if(SCENES[scene].key)SCENES[scene].key(e.key);
});
addEventListener('keyup',e=>{keys[e.key]=false});

// ===== 描画ヘルパー =====
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function text(s,x,y,size,col='#fff',align='center',stroke=null,sw=5){
  ctx.font=`bold ${size}px ${FONT}`;ctx.textAlign=align;ctx.textBaseline='middle';
  if(stroke){ctx.lineWidth=sw;ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.strokeText(s,x,y)}
  ctx.fillStyle=col;ctx.fillText(s,x,y);
}
function emoji(e,x,y,size){ctx.font=`${size}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#000';ctx.fillText(e,x,y)}
function btn(x,y,w,h,label,col,fn,size=24){
  const hov=mouse.x>=x&&mouse.x<=x+w&&mouse.y>=y&&mouse.y<=y+h;
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.25)';rrect(x,y+5,w,h,14);ctx.fill();
  ctx.fillStyle=col;rrect(x,y-(hov?2:0),w,h,14);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=3;ctx.stroke();
  text(label,x+w/2,y+h/2-(hov?2:0),size,'#fff','center','rgba(0,0,0,.35)',4);
  ctx.restore();
  buttons.push({x,y,w,h,fn});
}
function panel(x,y,w,h,col='rgba(255,255,255,.95)',r=18){
  ctx.fillStyle='rgba(0,0,0,.25)';rrect(x+4,y+6,w,h,r);ctx.fill();
  ctx.fillStyle=col;rrect(x,y,w,h,r);ctx.fill();
}

// ===== エフェクト =====
let fx=[],parts=[],confetti=[];
function popText(s,x,y,col='#fff',size=26,life=0.9){fx.push({s,x,y,col,size,t:0,life})}
function burst(x,y,col,n=12,spd=220){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=spd*(0.4+Math.random()*0.6);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0.6+Math.random()*0.4,t:0,col:Array.isArray(col)?col[i%col.length]:col,size:3+Math.random()*4})}}
const CCOL=['#ff5a7a','#ffd23f','#3ec1ff','#7cf06a','#c47bff','#ff9f43'];
function addConfetti(n){for(let i=0;i<n;i++)confetti.push({x:Math.random()*W,y:-20-Math.random()*H*0.6,vx:(Math.random()-0.5)*60,vy:60+Math.random()*90,r:Math.random()*6,vr:(Math.random()-0.5)*8,col:CCOL[i%CCOL.length],w:6+Math.random()*6,h:4+Math.random()*4})}
function updFx(dt){
  fx.forEach(f=>{f.t+=dt;f.y-=40*dt});fx=fx.filter(f=>f.t<f.life);
  parts.forEach(p=>{p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt});parts=parts.filter(p=>p.t<p.life);
  confetti.forEach(c=>{c.x+=c.vx*dt+Math.sin(c.y/30)*0.6;c.y+=c.vy*dt;c.r+=c.vr*dt});confetti=confetti.filter(c=>c.y<H+20);
}
function drawFx(){
  parts.forEach(p=>{ctx.globalAlpha=1-p.t/p.life;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill()});
  ctx.globalAlpha=1;
  confetti.forEach(c=>{ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.r);ctx.fillStyle=c.col;ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);ctx.restore()});
  fx.forEach(f=>{const a=1-Math.max(0,(f.t-f.life*0.6)/(f.life*0.4));ctx.globalAlpha=a;const sc=f.t<0.1?0.6+f.t*4:1;text(f.s,f.x,f.y,f.size*sc,f.col,'center','rgba(0,0,0,.6)',5)});
  ctx.globalAlpha=1;
}

function drawSchool(t){
  // 空
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5ec8ff');g.addColorStop(0.7,'#bfeaff');g.addColorStop(1,'#bfeaff');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // 雲
  ctx.fillStyle='rgba(255,255,255,.9)';
  for(let i=0;i<4;i++){const x=((i*290+t*12)%(W+200))-100,y=60+i*28%80;ctx.beginPath();ctx.arc(x,y,26,0,7);ctx.arc(x+30,y-12,30,0,7);ctx.arc(x+62,y,24,0,7);ctx.fill()}
  // 校庭
  ctx.fillStyle='#7ccf5a';ctx.fillRect(0,400,W,140);
  ctx.fillStyle='#d9b77a';ctx.beginPath();ctx.ellipse(480,480,380,50,0,0,7);ctx.fill();
  // 校舎
  ctx.fillStyle='#f6efe2';ctx.fillRect(130,190,700,215);
  ctx.fillStyle='#e6dccb';ctx.fillRect(130,190,700,14);
  ctx.fillStyle='#f6efe2';ctx.fillRect(410,130,140,80);
  ctx.fillStyle='#e6dccb';ctx.fillRect(410,130,140,10);
  // 時計
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(480,168,24,0,7);ctx.fill();ctx.strokeStyle='#555';ctx.lineWidth=3;ctx.stroke();
  ctx.beginPath();ctx.moveTo(480,168);ctx.lineTo(480,152);ctx.moveTo(480,168);ctx.lineTo(492,172);ctx.stroke();
  // 窓
  for(let r=0;r<3;r++)for(let c=0;c<10;c++){
    if(c>=4&&c<=5&&r===2)continue;
    ctx.fillStyle='#8fd3ff';ctx.fillRect(150+c*68,215+r*62,48,40);
    ctx.strokeStyle='#c0b49e';ctx.lineWidth=3;ctx.strokeRect(150+c*68,215+r*62,48,40);
  }
  // 玄関
  ctx.fillStyle='#8a6e4b';ctx.fillRect(430,340,100,65);
  ctx.fillStyle='#bfa074';ctx.fillRect(478,340,4,65);
  // 校名プレート
  ctx.fillStyle='#3a6b3a';rrect(390,318,180,22,4);ctx.fill();
  text('柏の葉小学校',480,330,15,'#fff');
  // 垂れ幕
  ctx.fillStyle='#e8344e';ctx.fillRect(690,200,90,195);
  ctx.fillStyle='#fff';ctx.fillRect(696,206,78,183);
  ctx.fillStyle='#e8344e';
  text('祝',735,228,28,'#e8344e');text('15',735,268,40,'#e8344e');text('周',735,308,28,'#e8344e');text('年',735,348,28,'#e8344e');
  // ちょうちんのひも
  ctx.strokeStyle='#555';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,110);ctx.quadraticCurveTo(240,160,480,110);ctx.quadraticCurveTo(720,160,960,110);ctx.stroke();
  for(let i=0;i<13;i++){const x=i*80+0,yy=110+Math.sin((x%480)/480*Math.PI)*25+12;
    ctx.fillStyle=i%2?'#ff5a5a':'#ffcf3f';ctx.beginPath();ctx.ellipse(x,yy,13,17,0,0,7);ctx.fill();
    ctx.fillStyle='#333';ctx.fillRect(x-8,yy-18,16,4);ctx.fillRect(x-8,yy+14,16,4)}
  // 木
  [[60,400],[900,400],[100,420]].forEach(([x,y])=>{ctx.fillStyle='#8a5a2b';ctx.fillRect(x-6,y-40,12,40);ctx.fillStyle='#3fa34d';ctx.beginPath();ctx.arc(x,y-60,36,0,7);ctx.fill()});
}

function finishShow(base,stats){
  const S=SHOWS[showId],m=mult(),fin=Math.round(base*m);
  const r=fin/(S.target*1.5);
  const rank=r>=1?'S':r>=0.75?'A':r>=0.5?'B':'C';
  const best=loadBest(showId),newBest=fin>best;
  if(newBest)saveBest(showId,fin);
  RES={base,m,fin,rank,visitors:Math.max(5,Math.round(fin/15)),best:Math.max(best,fin),newBest,stats};
  go('result');
}

SCENES.ghost={
  enter(){G={t:0,dur:45,ready:2.2,guests:[],spawnT:0.3,score:0,combo:0,maxCombo:0,perfect:0,scared:0,shake:0,

let D={};
const BPM=100,LX=300,LW=90,HITY=430,TOPY=60,TRAVEL=2.2,GOOD_W=0.22,PERF_W=0.1;
const CHORDS=[[60,64,67,72],[57,60,64,69],[53,57,60,65],[55,59,62,67]];
const LCOL=['#ff5a7a','#3ec1ff','#7cf06a','#ffd23f'],LKEY=['D','F','J','K'];
SCENES.dance={
  enter(){
    const a=ac();const beat=60/BPM,startBeat=4,len=48;
    D={notes:[],beat,start:(a?a.currentTime:0)+0.8,sched:0,startBeat,len,score:0,combo:0,maxCombo:0,perfect:0,good:0,miss:0,flash:[0,0,0,0],judge:'',judgeT:0,clock0:performance.now()};
    let last=-1;
    for(let b=startBeat;b<startBeat+len;b+=0.5){
      const sec=(b-startBeat)/len,on=b%1===0;
      // かんたんモード：はじめは 2拍に1回、さいごだけ 少しふえる
      let p=on?(sec<0.3?(b%2===0?0.9:0):sec<0.7?0.6:0.75):(sec>0.75?0.12:0);
      if(b>=startBeat+len-2&&!on)p=0;
      if(Math.random()<p){
        let lane;do{lane=Math.floor(Math.random()*4)}while(lane===last&&Math.random()<0.7);
        last=lane;D.notes.push({t:b*beat,lane,hit:false,gone:false});
      }
    }
    D.total=D.notes.length;D.endT=(startBeat+len+3)*beat;D.totalBeats=startBeat+len+1;
  },
  now(){return AC?AC.currentTime-D.start:(performance.now()-D.clock0)/1000-0.8},
  update(dt){
    const t=this.now();
    // 音楽をスケジュール
    if(AC){
      while(D.sched<D.totalBeats&&D.sched*D.beat<t+0.3){
        const b=D.sched,when=D.start+b*D.beat;
        if(when>=AC.currentTime-0.05){
          if(b<D.startBeat){tone(b===D.startBeat-1?1320:880,0.08,'square',0.08,when)}
          else{
            tone(150,0.18,'sine',0.35,when,45);
            noise(0.05,0.06,when+D.beat/2,7000);
            if(b%2===1)noise(0.12,0.1,when,2500);
            const ch=CHORDS[Math.floor((b-D.startBeat)/4)%4];
            tone(mtof(ch[0]-24),D.beat*0.9,'triangle',0.18,when);
          }
        }
        D.sched++;
      }
    }
    D.flash=D.flash.map(f=>Math.max(0,f-dt*4));D.judgeT-=dt;
    D.notes.forEach(n=>{if(!n.hit&&!n.gone&&t-n.t>GOOD_W){n.gone=true;D.miss++;D.combo=0;D.judge='ミス';D.judgeT=0.5;D.judgeCol='#99a'}});
    if(t>D.endT)finishShow(D.score,[['パーフェクト',D.perfect],['グッド',D.good],['ミス',D.miss],['さいだいコンボ',D.maxCombo]]);
  },
  press(l){
    const t=this.now();D.flash[l]=1;
    let best=null,bd=1;
    D.notes.forEach(n=>{if(n.lane===l&&!n.hit&&!n.gone){const d=Math.abs(n.t-t);if(d<bd){bd=d;best=n}}});
    if(!best||bd>GOOD_W)return;
    best.hit=true;
    const perf=bd<PERF_W;
    D.combo++;D.maxCombo=Math.max(D.maxCombo,D.combo);
    if(perf)D.perfect++;else D.good++;
    D.score+=(perf?100:50)+Math.min(D.combo,50)*2;
    D.judge=perf?'パーフェクト！':'グッド！';D.judgeCol=perf?'#ffd23f':'#9ef';D.judgeT=0.5;
    const ch=CHORDS[Math.floor((best.t/D.beat-D.startBeat)/4)%4];
    tone(mtof(ch[l]+12),0.25,'square',0.08);
    burst(LX+LW*l+LW/2,HITY,LCOL[l],perf?14:7);
  },
  key(k){const m={d:0,f:1,j:2,k:3,D:0,F:1,J:2,K:3,ArrowLeft:0,ArrowDown:1,ArrowUp:2,ArrowRight:3};if(k in m)this.press(m[k])},
  tap(p){if(p.y<60)return;this.press(Math.max(0,Math.min(3,Math.floor(p.x/(W/4)))))},
  draw(){
    const t=this.now(),bp=((t/D.beat)%1+1)%1,pulse=1-bp;
    // 体育館ステージ
    ctx.fillStyle='#3b1a2e';ctx.fillRect(0,0,W,H);
    // スポットライト
    for(let i=0;i<4;i++){const x=120+i*240+Math.sin(sceneT+i)*60;
      const gr=ctx.createRadialGradient(x,0,10,x,0,420);gr.addColorStop(0,`hsla(${(i*80+sceneT*40)%360},90%,70%,.35)`);gr.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H)}
    // カーテン
    ctx.fillStyle='#b3203a';ctx.fillRect(0,0,70,H);ctx.fillRect(W-70,0,70,H);
    for(let i=0;i<4;i++){ctx.fillStyle='rgba(0,0,0,.15)';ctx.fillRect(i*18,0,8,H);ctx.fillRect(W-70+i*18,0,8,H)}
    ctx.fillStyle='#8e1a2e';ctx.fillRect(0,0,W,36);
    text('〜柏の葉小 15周年きねん 4年2組ステージ〜',480,58,18,'rgba(255,230,150,.9)');
    // ゆか
    ctx.fillStyle='#a8743d';ctx.fillRect(0,470,W,70);
    // ダンサー
    const dance=Math.abs(Math.sin(t/D.beat*Math.PI));
    const crew=D.combo>=20?['🕺','💃','🕺']:['🧒','👧','👦'];
    [[150,300],[110,400],[190,400]].forEach(([x,y],i)=>emoji(crew[i],x,y-dance*14,50));
    [[810,300],[770,400],[850,400]].forEach(([x,y],i)=>emoji(crew[(i+1)%3],x,y-dance*14,50));
    // レーン
    for(let l=0;l<4;l++){const x=LX+l*LW;
      ctx.fillStyle=`rgba(0,0,0,${0.45-D.flash[l]*0.2})`;ctx.fillRect(x+2,TOPY+10,LW-4,HITY-TOPY+40);
      if(D.flash[l]>0){ctx.fillStyle=LCOL[l];ctx.globalAlpha=D.flash[l]*0.3;ctx.fillRect(x+2,TOPY+10,LW-4,HITY-TOPY+40);ctx.globalAlpha=1}}
    ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(LX,HITY);ctx.lineTo(LX+LW*4,HITY);ctx.stroke();
    for(let l=0;l<4;l++){const cx=LX+l*LW+LW/2;
      ctx.strokeStyle=LCOL[l];ctx.lineWidth=4;ctx.beginPath();ctx.arc(cx,HITY,26+pulse*3,0,7);ctx.stroke();
      text(LKEY[l],cx,HITY+48,20,'#fff')}
    // 音ぷ
    D.notes.forEach(n=>{
      if(n.hit)return;
      const y=HITY-(n.t-t)/TRAVEL*(HITY-TOPY);
      if(y<TOPY-20||y>HITY+60)return;
      const cx=LX+n.lane*LW+LW/2;
      ctx.globalAlpha=n.gone?0.3:1;
      ctx.fillStyle=LCOL[n.lane];ctx.beginPath();ctx.arc(cx,y,24,0,7);ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
      text(LKEY[n.lane],cx,y+1,22,'#fff');
      ctx.globalAlpha=1;
    });
    // はんてい
    if(D.judgeT>0)text(D.judge,480,250,40,D.judgeCol,'center','#000',6);
    if(D.combo>=5)text(`${D.combo} コンボ`,480,300,28,'#fff','center','#000',5);
    // お客さん
    for(let i=0;i<14;i++){const x=40+i*68,y=520-(D.combo>=10?Math.abs(Math.sin(t*6+i))*10:0);emoji(['👦','👧','👨','👩','🧒','👵','👴'][i%7],x,y,34)}
    if(D.combo>=10){emoji('🙌',100+(sceneT*80)%760,480,26)}
    hudTop('💃 ステージダンス',D.score,0,`${Math.min(D.total,D.perfect+D.good+D.miss)}/${D.total}`);
    if(t<0)text('もうすぐ はじまるよ！',480,250,36,'#fff','center','#000',6);
    else if(t<D.startBeat*D.beat){const c=D.startBeat-Math.floor(t/D.beat);text(c>0?String(c):'',480,250,80,'#fff','center','#e8344e',10)}
  }
};

let SH={};
const TTYPES=[{e:'🍬',p:50,s:48,w:4},{e:'🧸',p:100,s:52,w:3},{e:'🎁',p:150,s:44,w:2},{e:'🤖',p:200,s:38,w:1.5},{e:'⭐',p:400,s:32,w:0.6}];
const ROWY=[200,320,440],ROWV=[110,-85,65];
function pickT(row){const list=TTYPES.filter(t=>row===0||t.e!=='⭐');const tot=list.reduce((a,t)=>a+t.w,0);let r=Math.random()*tot;for(const t of list){r-=t.w;if(r<0)return t}return list[0]}
SCENES.shoot={
  enter(){
    SH={t:0,dur:40,ready:2.2,corks:25,score:0,combo:0,maxCombo:0,hits:0,targets:[],shots:[],cx:480,cy:300,endT:0,recoil:0};
    for(let r=0;r<3;r++)for(let i=0;i<4;i++)SH.targets.push({row:r,x:i*260+Math.random()*60,ty:pickT(r),alive:true,fy:0,vy:0,re:0});
  },
  update(dt){
    SH.recoil=Math.max(0,SH.recoil-dt*6);
    // 照準
    if(keys.ArrowLeft)SH.cx-=420*dt;if(keys.ArrowRight)SH.cx+=420*dt;if(keys.ArrowUp)SH.cy-=420*dt;if(keys.ArrowDown)SH.cy+=420*dt;
    SH.cx=Math.max(20,Math.min(W-20,SH.cx));SH.cy=Math.max(70,Math.min(470,SH.cy));
    SH.targets.forEach(tg=>{
      const v=ROWV[tg.row]*(tg.ty.e==='⭐'?1.8:1)*(1+SH.t/SH.dur*0.4);
      tg.x+=v*dt;if(tg.x>W+60)tg.x-=W+120;if(tg.x<-60)tg.x+=W+120;
      if(!tg.alive){
        if(tg.fy<200){tg.vy+=900*dt;tg.fy+=tg.vy*dt}
        tg.re-=dt;if(tg.re<=0){tg.alive=true;tg.fy=0;tg.vy=0;tg.ty=pickT(tg.row);tg.x=ROWV[tg.row]>0?-50:W+50}
      }
    });
    SH.shots.forEach(s=>s.t+=dt);SH.shots=SH.shots.filter(s=>s.t<0.5);
    if(SH.ready>0){SH.ready-=dt;if(SH.ready<=0)SFX.start();return}
    SH.t+=dt;
    if(SH.t>=SH.dur||SH.corks<=0){SH.endT+=dt;if(SH.endT>1.2)finishShow(SH.score,[['当たった数',SH.hits],['のこりコルク',SH.corks],['さいだいコンボ',SH.maxCombo]])}
  },
  fire(x,y){
    if(SH.ready>0||SH.corks<=0||SH.t>=SH.dur)return;
    SH.corks--;SH.recoil=1;SFX.shoot();SH.shots.push({x,y,t:0});
    let hit=null;
    SH.targets.forEach(tg=>{if(!tg.alive)return;const ty=ROWY[tg.row]-tg.ty.s/2-6;if(Math.hypot(tg.x-x,ty-y)<tg.ty.s*0.62)hit=tg});
    if(hit){
      hit.alive=false;hit.vy=-250;hit.re=1.6;SH.combo++;SH.hits++;SH.maxCombo=Math.max(SH.maxCombo,SH.combo);
      const pts=hit.ty.p+(SH.combo-1)*20;SH.score+=pts;SFX.pop();
      burst(hit.x,ROWY[hit.row]-30,CCOL,hit.ty.e==='⭐'?24:12);
      popText(`+${pts}`,hit.x,ROWY[hit.row]-70,hit.ty.e==='⭐'?'#ffd23f':'#fff',hit.ty.e==='⭐'?32:24);
      if(hit.ty.e==='⭐')popText('15周年スター！',hit.x,ROWY[hit.row]-105,'#ff9fd0',24,1.3);
    }else{SH.combo=0;popText('はずれ',x,y-30,'#ccc',18,0.6)}
  },
  key(k){if(k===' '||k==='Enter')this.fire(SH.cx,SH.cy)},
  tap(p){SH.cx=p.x;SH.cy=p.y;this.fire(p.x,p.y)},
  draw(){
    if(Math.abs(mouse.x-SH.lmx)>0.5||Math.abs(mouse.y-SH.lmy)>0.5){SH.cx=mouse.x;SH.cy=Math.max(70,Math.min(470,mouse.y))}
    SH.lmx=mouse.x;SH.lmy=mouse.y;
    // かべ
    ctx.fillStyle='#ffe9c2';ctx.fillRect(0,0,W,H);
    for(let x=0;x<W;x+=48){ctx.fillStyle='rgba(255,180,100,.18)';ctx.fillRect(x,0,24,H)}
    // やね（しま）
    for(let i=0;i<20;i++){ctx.fillStyle=i%2?'#fff':'#e8344e';ctx.beginPath();ctx.moveTo(i*48,48);ctx.lineTo(i*48+48,48);ctx.lineTo(i*48+48,92);ctx.quadraticCurveTo(i*48+24,112,i*48,92);ctx.fill()}
    panel(370,96,220,40,'#8a5a2b',10);text('4-2 しゃてき屋',480,116,22,'#fff');
    // たな
    ROWY.forEach(y=>{ctx.fillStyle='#8a5a2b';ctx.fillRect(0,y,W,16);ctx.fillStyle='#6b4420';ctx.fillRect(0,y+16,W,6)});
    // 景品
    SH.targets.forEach(tg=>{
      const y=ROWY[tg.row]-tg.ty.s/2-6+tg.fy;
      if(!tg.alive&&tg.fy>=200)return;
      ctx.save();ctx.translate(tg.x,y);if(!tg.alive)ctx.rotate(tg.fy/40);
      if(tg.ty.e==='⭐'){ctx.fillStyle='rgba(255,230,80,.5)';ctx.beginPath();ctx.arc(0,0,tg.ty.s*0.8+Math.sin(sceneT*8)*3,0,7);ctx.fill()}
      emoji(tg.ty.e,0,0,tg.ty.s);
      ctx.restore();
      if(tg.alive){ctx.fillStyle='rgba(0,0,0,.5)';rrect(tg.x-20,ROWY[tg.row]+20,40,16,4);ctx.fill();text(String(tg.ty.p),tg.x,ROWY[tg.row]+28,11,'#fff')}
    });
    // コルクのあと
    SH.shots.forEach(s=>{ctx.globalAlpha=1-s.t/0.5;ctx.fillStyle='#c98a4b';ctx.beginPath();ctx.arc(s.x,s.y,10*(1-s.t),0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(s.x,s.y,10+s.t*50,0,7);ctx.stroke()});
    ctx.globalAlpha=1;
    // カウンター
    ctx.fillStyle='#c0392b';ctx.fillRect(0,478,W,62);ctx.fillStyle='#e74c3c';ctx.fillRect(0,478,W,8);
    for(let i=0;i<25;i++){ctx.fillStyle=i<SH.corks?'#d9a066':'rgba(0,0,0,.25)';ctx.beginPath();ctx.arc(30+i*20,512,7,0,7);ctx.fill()}
    text(`コルク のこり ${SH.corks}`,620,512,20,'#fff','left');
    // てっぽう
    const gx=480+(SH.cx-480)*0.3,gy=560-SH.recoil*12;
    ctx.save();ctx.translate(gx,gy);ctx.rotate(Math.atan2(SH.cy-gy,SH.cx-gx)+Math.PI/2);
    ctx.fillStyle='#6b4420';ctx.fillRect(-12,-10,24,80);ctx.fillStyle='#444';ctx.fillRect(-8,-70,16,70);ctx.fillStyle='#d9a066';ctx.fillRect(-9,-80,18,12);
    ctx.restore();
    // 照準
    ctx.strokeStyle='#e8344e';ctx.lineWidth=3;ctx.beginPath();ctx.arc(SH.cx,SH.cy,20,0,7);ctx.stroke();
    ctx.beginPath();ctx.moveTo(SH.cx-30,SH.cy);ctx.lineTo(SH.cx-10,SH.cy);ctx.moveTo(SH.cx+10,SH.cy);ctx.lineTo(SH.cx+30,SH.cy);
    ctx.moveTo(SH.cx,SH.cy-30);ctx.lineTo(SH.cx,SH.cy-10);ctx.moveTo(SH.cx,SH.cy+10);ctx.lineTo(SH.cx,SH.cy+30);ctx.stroke();
    hudTop('🎯 しゃてき屋さん',SH.score,SH.combo,Math.max(0,Math.ceil(SH.dur-SH.t))+'びょう');
    drawReady(SH.ready);
    if(SH.corks<=0&&SH.endT>0)text('コルク おしまい！',480,280,48,'#fff','center','#e8344e',8);
  }
};

    if(QZ.shown>=0){QZ.showT-=dt;if(QZ.showT<=0){QZ.i++;QZ.shown=-1;QZ.picked=-1;QZ.qt=10;
      if(QZ.i>=QZ.qs.length)finishShow(QZ.score,[['正かい',`${QZ.right}/10`],['さいだいコンボ',QZ.maxCombo]])}return}
    QZ.qt-=dt;if(QZ.qt<=0){QZ.qt=0;this.answer(-1)}
  },
  answer(k){
    if(QZ.ready>0||QZ.shown>=0||QZ.i>=QZ.qs.length)return;
    const Q=QZ.qs[QZ.i];QZ.picked=k;QZ.shown=Q.ans;QZ.showT=1.4;
    if(k===Q.ans){
      QZ.combo++;QZ.right++;QZ.maxCombo=Math.max(QZ.maxCombo,QZ.combo);
      const pts=100+Math.round(QZ.qt*10)+(QZ.combo-1)*20;QZ.score+=pts;
      SFX.fanfare();popText(`せいかい！ +${pts}`,480,250,'#ffd23f',34,1.2);burst(480,250,CCOL,20);
    }else{QZ.combo=0;SFX.miss();popText(k<0?'時間ぎれ…':'ざんねん…',480,250,'#aab',30,1.2)}
  },
  key(k){if('1234'.includes(k)&&k.length===1)this.answer(+k-1)},
  draw(){
    ctx.fillStyle='#1a3a6a';ctx.fillRect(0,0,W,H);
    for(let i=0;i<5;i++){const x=100+i*190;const gr=ctx.createRadialGradient(x,0,10,x,0,360);gr.addColorStop(0,`hsla(${200+i*30},90%,70%,.25)`);gr.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H)}
    emoji('🎤',90,140+Math.sin(sceneT*3)*4,60);text('しかい',90,190,16,'#fff');
    const Q=QZ.qs[Math.min(QZ.i,QZ.qs.length-1)];
    panel(160,64,640,120,'#fff',18);
    text(`だい ${Math.min(QZ.i+1,10)} もん`,480,88,18,'#2f9be8');
    text(Q.q,480,140,28,'#333');
    // 時間バー
    ctx.fillStyle='rgba(255,255,255,.2)';rrect(160,196,640,14,7);ctx.fill();
    ctx.fillStyle=QZ.qt<3?'#ff5050':'#7cf06a';rrect(160,196,640*QZ.qt/10,14,7);ctx.fill();
    Q.c.forEach((c,k)=>{
      const x=160+(k%2)*330,y=230+Math.floor(k/2)*110;
      let col=QCOL[k];
      if(QZ.shown>=0){col=k===QZ.shown?'#3ebd6a':(k===QZ.picked?'#888':'rgba(120,120,140,.6)')}
      btn(x,y,310,90,'',col,()=>this.answer(k),24);
      text(`${k+1}`,x+34,y+45,30,'rgba(255,255,255,.85)');
      text(c,x+175,y+45,30,'#fff','center','rgba(0,0,0,.3)',4);
      if(QZ.shown>=0&&k===QZ.shown)text('⭕',x+280,y+45,30,'#fff');
      if(QZ.shown>=0&&k===QZ.picked&&k!==QZ.shown)text('❌',x+280,y+45,26,'#fff');
    });
    for(let i=0;i<9;i++)emoji(['👦','👧','👨','👩','🧒','👵','👴','👧','👦'][i],60+i*105,515,30);
    hudTop('🎤 クイズ大会',QZ.score,QZ.combo,`${Math.min(QZ.i+1,10)}/10もん`);
    drawReady(QZ.ready);
  }
};

// ============================================================
//  ミニゲーム5：わなげ
// ============================================================
let WN={};
const NEAR_Y=470,FAR_Y=140;
function wnScale(y){return 0.55+(y-FAR_Y)/(NEAR_Y-FAR_Y)*0.5}
SCENES.wanage={
  enter(){
    WN={rings:10,ph:'aim',ax:480,adir:1,pw:0,pdir:1,fly:null,landed:[],score:0,combo:0,maxCombo:0,hits:0,ready:2.2,endT:0,
      pegs:[{x:220,y:420,p:50},{x:480,y:440,p:50},{x:740,y:420,p:50},{x:330,y:320,p:100},{x:630,y:320,p:100},{x:220,y:230,p:150},{x:740,y:230,p:150},{x:480,y:200,p:200},{x:480,y:150,p:300,star:true}]};
  },
  landY(){return NEAR_Y-WN.pw*(NEAR_Y-FAR_Y)},
  update(dt){
    if(WN.ready>0){WN.ready-=dt;if(WN.ready<=0)SFX.start();return}
    if(WN.ph==='aim'){WN.ax+=WN.adir*330*dt;if(WN.ax>860){WN.ax=860;WN.adir=-1}if(WN.ax<100){WN.ax=100;WN.adir=1}}
    if(WN.ph==='power'){WN.pw+=WN.pdir*0.85*dt;if(WN.pw>1){WN.pw=1;WN.pdir=-1}if(WN.pw<0){WN.pw=0;WN.pdir=1}}
    if(WN.ph==='fly'){
      const F=WN.fly;F.t+=dt/0.7;
      if(F.t>=1){
        let best=null,bd=1e9;
        WN.pegs.forEach(pg=>{const d=Math.hypot(pg.x-F.x1,(pg.y-F.y1)*1.3);if(d<bd){bd=d;best=pg}});
        const tol=28*wnScale(best.y);
        if(bd<tol){
          WN.combo++;WN.hits++;WN.maxCombo=Math.max(WN.maxCombo,WN.combo);
          const pts=best.p+(WN.combo-1)*20;WN.score+=pts;SFX.fanfare();
          WN.landed.push({x:best.x,y:best.y,on:true,n:WN.landed.filter(l=>l.on&&l.x===best.x&&l.y===best.y).length});
          burst(best.x,best.y-30,CCOL,best.star?24:14);popText(`+${pts}`,best.x,best.y-70,'#ffd23f',30);
          if(best.star)popText('15周年スター！',best.x,best.y-100,'#ff9fd0',24,1.3);
        }else{WN.combo=0;SFX.miss();WN.landed.push({x:F.x1,y:F.y1,on:false});popText('おしい！',F.x1,F.y1-40,'#fff',22)}
        WN.ph=WN.rings>0?'aim':'end';WN.pw=0;WN.pdir=1;
      }
    }
    if(WN.ph==='end'){WN.endT+=dt;if(WN.endT>1.3)finishShow(WN.score,[['入った数',`${WN.hits}/10`],['さいだいコンボ',WN.maxCombo]])}
  },
  act(){
    if(WN.ready>0)return;
    if(WN.ph==='aim'){WN.ph='power';SFX.click()}
    else if(WN.ph==='power'){WN.ph='fly';WN.rings--;SFX.shoot();WN.fly={t:0,x0:480,y0:530,x1:WN.ax,y1:this.landY()}}
  },
  key(k){if(k===' '||k==='Enter')this.act()},
  tap(){this.act()},
  draw(){
    // 空と校庭
    const g=ctx.createLinearGradient(0,0,0,130);g.addColorStop(0,'#5ec8ff');g.addColorStop(1,'#bfeaff');ctx.fillStyle=g;ctx.fillRect(0,0,W,130);
    ctx.fillStyle='#f6efe2';ctx.fillRect(250,60,460,70);for(let c=0;c<8;c++){ctx.fillStyle='#8fd3ff';ctx.fillRect(265+c*56,72,36,22)}
    text('柏の葉小学校',640,115,14,'#3a6b3a');
    ctx.fillStyle='#d9b77a';ctx.fillRect(0,130,W,H-130);
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(480,330,400,170,0,0,7);ctx.stroke();
    // ぼう
    WN.pegs.forEach(pg=>{const s=wnScale(pg.y);
      ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(pg.x,pg.y,22*s,8*s,0,0,7);ctx.fill();
      ctx.fillStyle=pg.star?'#ffcf3f':'#8a5a2b';ctx.fillRect(pg.x-5*s,pg.y-60*s,10*s,60*s);
      if(pg.star)emoji('⭐',pg.x,pg.y-70*s,26*s);
      ctx.fillStyle='rgba(0,0,0,.55)';rrect(pg.x-22,pg.y+8,44,18,5);ctx.fill();text(String(pg.p),pg.x,pg.y+17,12,'#fff');
    });
    WN.landed.forEach(l=>{const s=wnScale(l.y);ctx.strokeStyle=l.on?'#ff5a7a':'rgba(255,90,122,.5)';ctx.lineWidth=6*s;
      ctx.beginPath();ctx.ellipse(l.x,l.y-(l.on?8+l.n*6:0)*s,24*s,9*s,0,0,7);ctx.stroke()});
    // ねらい
    if(WN.ph==='aim'||WN.ph==='power'){
      const ly=WN.ph==='power'?this.landY():null;
      ctx.strokeStyle='rgba(255,255,255,.8)';ctx.setLineDash([6,8]);ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(WN.ax,NEAR_Y+20);ctx.lineTo(WN.ax,FAR_Y);ctx.stroke();ctx.setLineDash([]);
      if(ly!==null){const s=wnScale(ly);ctx.strokeStyle='#e8344e';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(WN.ax,ly,24*s,9*s,0,0,7);ctx.stroke()}
      // パワーゲージ
      ctx.fillStyle='rgba(0,0,0,.35)';rrect(900,FAR_Y,30,NEAR_Y-FAR_Y,10);ctx.fill();
      if(ly!==null){ctx.fillStyle='#ff9f1c';rrect(900,ly,30,NEAR_Y-ly,10);ctx.fill()}
      text('とおさ',915,FAR_Y-14,14,'#fff','center','rgba(0,0,0,.4)',3);
      text(WN.ph==='aim'?'① よこの 位置を きめよう！':'② とおさを きめよう！',480,500,26,'#fff','center','#7a4a00',6);
    }
    // とんでいる わっか
    if(WN.ph==='fly'){const F=WN.fly,t=Math.min(1,F.t);const x=F.x0+(F.x1-F.x0)*t,y=F.y0+(F.y1-F.y0)*t-Math.sin(t*Math.PI)*120,s=wnScale(Math.min(NEAR_Y,y));
      ctx.strokeStyle='#ff5a7a';ctx.lineWidth=6*s;ctx.beginPath();ctx.ellipse(x,y,26*s,10*s,t*6,0,7);ctx.stroke()}
    // のこり
    for(let i=0;i<10;i++){ctx.strokeStyle=i<WN.rings?'#ff5a7a':'rgba(0,0,0,.2)';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(30+i*28,520,10,5,0,0,7);ctx.stroke()}
    hudTop('🛟 わなげ',WN.score,WN.combo,`のこり ${WN.rings}こ`);
    drawReady(WN.ready);
  }
};

// ============================================================
//  ミニゲーム6：カードめくり
// ============================================================
let CD={};
const CARD_E=['🏫','🎆','🎈','🍡','🎤','👻','🎯','⭐'];
const CW=92,CH=100,CGX=14,CGY=10,CX0=(W-(CW*4+CGX*3))/2,CY0=66;
SCENES.cards={
  enter(){CD={cards:shuffle([...CARD_E,...CARD_E]).map(e=>({e,up:false,ok:false,a:0})),sel:[],lock:0,t:0,dur:60,score:0,combo:0,maxCombo:0,pairs:0,miss:0,ready:2.2,cur:0,endT:0,done:false}},
  update(dt){
    CD.cards.forEach(c=>{const tg=c.up||c.ok?1:0;c.a+=(tg-c.a)*Math.min(1,dt*14)});
    if(CD.ready>0){CD.ready-=dt;if(CD.ready<=0)SFX.start();return}
    if(CD.lock>0){CD.lock-=dt;if(CD.lock<=0){CD.sel.forEach(i=>CD.cards[i].up=false);CD.sel=[]}}
    if(!CD.done){CD.t+=dt;if(CD.t>=CD.dur){CD.t=CD.dur;CD.done=true}}
    if(CD.done){CD.endT+=dt;if(CD.endT>1.5)finishShow(CD.score,[['そろえた ペア',`${CD.pairs}/8`],['まちがい',CD.miss],['さいだいコンボ',CD.maxCombo]])}
  },
  flip(i){
    if(CD.ready>0||CD.done||CD.lock>0)return;
    const c=CD.cards[i];if(!c||c.up||c.ok)return;
    c.up=true;CD.sel.push(i);SFX.pop();
    if(CD.sel.length===2){
      const [a,b]=CD.sel.map(j=>CD.cards[j]);
      if(a.e===b.e){
        a.ok=b.ok=true;CD.sel=[];CD.pairs++;CD.combo++;CD.maxCombo=Math.max(CD.maxCombo,CD.combo);
        const pts=100+(CD.combo-1)*50;CD.score+=pts;SFX.pick();
        const [x,y]=this.pos(i);burst(x+CW/2,y+CH/2,CCOL,14);popText(`そろった！ +${pts}`,x+CW/2,y,'#ffd23f',24);
        if(CD.pairs===8){const bonus=Math.round((CD.dur-CD.t)*10);CD.score+=bonus;CD.done=true;SFX.fanfare();addConfetti(60);popText(`タイムボーナス +${bonus}`,480,280,'#fff',34,1.5)}
      }else{CD.combo=0;CD.miss++;CD.lock=0.8;SFX.miss()}
    }
  },
  pos(i){return[CX0+(i%4)*(CW+CGX),CY0+Math.floor(i/4)*(CH+CGY)]},
  key(k){
    if(k==='ArrowLeft')CD.cur=(CD.cur+15)%16;if(k==='ArrowRight')CD.cur=(CD.cur+1)%16;
    if(k==='ArrowUp')CD.cur=(CD.cur+12)%16;if(k==='ArrowDown')CD.cur=(CD.cur+4)%16;
    if(k===' '||k==='Enter')this.flip(CD.cur);
  },
  tap(p){CD.cards.forEach((c,i)=>{const [x,y]=this.pos(i);if(p.x>=x&&p.x<=x+CW&&p.y>=y&&p.y<=y+CH){CD.cur=i;this.flip(i)}})},
  draw(){
    ctx.fillStyle='#f0e6d6';ctx.fillRect(0,0,W,H);
    for(let i=0;i<6;i++){ctx.fillStyle='#8a5a2b';ctx.fillRect(i<3?20:820,70+(i%3)*150,120,12);
      for(let j=0;j<6;j++){ctx.fillStyle=CCOL[(i+j)%6];ctx.fillRect((i<3?24:824)+j*19,30+(i%3)*150+((i+j)%3)*4,15,40-((i+j)%3)*4)}}
    text('図書室',80,500,22,'#8a5a2b');text('4-2',880,500,22,'#8a5a2b');
    CD.cards.forEach((c,i)=>{
      const [x,y]=this.pos(i),sx=Math.abs(Math.cos(c.a*Math.PI));
      ctx.save();ctx.translate(x+CW/2,y+CH/2);ctx.scale(Math.max(0.04,sx),1);
      if(c.a<0.5){
        ctx.fillStyle='#c44fd6';rrect(-CW/2,-CH/2,CW,CH,12);ctx.fill();
        ctx.strokeStyle='#fff';ctx.lineWidth=3;rrect(-CW/2+6,-CH/2+6,CW-12,CH-12,8);ctx.stroke();
        text('15',0,0,30,'rgba(255,255,255,.85)');
      }else{
        ctx.fillStyle=c.ok?'#fff7d6':'#fff';rrect(-CW/2,-CH/2,CW,CH,12);ctx.fill();
        ctx.strokeStyle=c.ok?'#ffd23f':'#c44fd6';ctx.lineWidth=3;ctx.stroke();
        emoji(c.e,0,2,52);
      }
      ctx.restore();
      if(i===CD.cur&&keys.lastKeyboard){ctx.strokeStyle='#e8344e';ctx.lineWidth=4;rrect(x-4,y-4,CW+8,CH+8,14);ctx.stroke()}
    });
    hudTop('🃏 カードめくり',CD.score,CD.combo,Math.max(0,Math.ceil(CD.dur-CD.t))+'びょう');
    drawReady(CD.ready);
  }
};

// ============================================================
//  けっか発表
// ============================================================
let RES={};
const RANKS={
  S:{t:'15周年MVP！ でんせつの4年2組！',c:'#ffb800',voice:['すごすぎる〜！','校長先生も 大よろこび！','来年も やりたい！']},
  A:{t:'大せいこう！',c:'#ff5a7a',voice:['たのしかった〜！','お客さん いっぱい来たね！','リーダー ありがとう！']},
  B:{t:'まあまあ せいこう！',c:'#3ec1ff',voice:['なかなか よかったよ！','つぎは もっと もりあげよう！','がんばったね！']},
  C:{t:'つぎは がんばろう…',c:'#8a8aa0',voice:['どんまい！','れんしゅうすれば できる！','もう1回 やろう！']}
};
SCENES.result={
  enter(){RES.anim=0;SFX.fanfare();if(RES.rank==='S'||RES.rank==='A')addConfetti(140)},
  update(dt){RES.anim+=dt;if((RES.rank==='S'||RES.rank==='A')&&Math.random()<dt*3)addConfetti(6)},
  draw(){
    const S=SHOWS[showId],R=RANKS[RES.rank];
    drawSchool(sceneT);
    ctx.fillStyle='rgba(30,20,60,.45)';ctx.fillRect(0,0,W,H);
    panel(90,22,780,496);
    text(`けっか発表！ ${S.e} ${S.name}`,480,62,32,S.col2);
    const k=Math.min(1,RES.anim/1.2);
    // スコア
    const lines=[['本番のスコア',Math.round(RES.base*k)],[`もりあがり ×${RES.m.toFixed(2)}`,''],['さいしゅうスコア',Math.round(RES.fin*k)]];
    lines.forEach((l,i)=>{text(l[0],150,112+i*40,i===2?24:20,i===2?'#333':'#666','left');text(String(l[1]),500,112+i*40,i===2?30:22,i===2?'#e8344e':'#333','right')});
    text(`お客さん ${Math.round(RES.visitors*k)}人 来たよ！`,320,236,22,'#3a8a3a');
    RES.stats.forEach((s,i)=>text(`${s[0]}: ${s[1]}`,150+(i%2)*190,272+Math.floor(i/2)*28,16,'#777','left'));
    // ランク
    if(RES.anim>1.3){
      const sc=Math.min(1,(RES.anim-1.3)*4),z=1+(1-sc)*2;
      ctx.save();ctx.translate(700,180);ctx.scale(z,z);ctx.rotate(-0.12);ctx.globalAlpha=sc;
      ctx.strokeStyle=R.c;ctx.lineWidth=8;rrect(-80,-80,160,160,24);ctx.stroke();
      text('ランク',0,-52,22,R.c);
      text(RES.rank,0,14,100,R.c);
      ctx.restore();ctx.globalAlpha=1;
      text(R.t,480,338,28,R.c,'center','#fff',5);
      if(RES.newBest)text('🎉 ハイスコア こうしん！ 🎉',700,290,18,'#e8a000');
      else text(`ハイスコア ${RES.best}`,700,290,16,'#999');
      // クラスのこえ
      ['🧒','👧','👦'].forEach((e,i)=>{const x=105+i*255;emoji(e,x+20,388,36);
        ctx.fillStyle='#f3efff';rrect(x+42,370,200,38,12);ctx.fill();text(R.voice[i],x+142,389,15,'#555')});
    }
    btn(130,438,220,56,'もう1回','#3ebd6a',()=>go('prep'),22);
    btn(370,438,220,56,'ほかの出し物','#ff9f1c',()=>go('choose'),22);
    btn(610,438,220,56,'タイトルへ','#7b52d6',()=>go('title'),22);
  },
  key(k){if(k==='Enter')go('prep')}
};

// ===== メインループ =====
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;sceneT+=dt;
  const sc=SCENES[scene];
  if(sc.update)sc.update(dt);
  updFx(dt);
  buttons=[];
  ctx.setTransform(DPR,0,0,DPR,0,0);
  SCENES[scene].draw(dt);
  drawFx();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
